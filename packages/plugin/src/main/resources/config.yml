# VoidBans plugin configuration.
# This connects to the SAME MySQL database as the web app. See
# packages/web/.env's DATABASE_URL for the connection this must match.

database:
  host: localhost
  port: 3306
  name: voidbans
  user: voidbans
  password: ""

# Must match SITE_URL in the web app's .env. Used only for the {site_url}
# placeholder below: changing where the site is deployed is a one-line
# edit here and in the web app's .env, never a plugin rebuild.
site-url: "https://your-domain.example"

server-id: "survival"

# Configurable prefix shown before every message this plugin sends in
# chat (staff alerts below, and any future broadcast). Colors use '&'
# Minecraft color codes.
chat-prefix: "&8[&cVoidBans&8] &r"

# Staff alert broadcast whenever a punishment is issued. From an in-game
# command OR the web dashboard. Only sent to players holding
# staff-alert-permission (set this up as a LuckPerms permission and grant
# it to whichever ranks should see it. See the README for the exact
# LuckPerms command).
staff-alerts:
  enabled: true
  permission: "voidbans.alerts.punishments"
  # How often (in seconds) the plugin checks for new punishments issued
  # via the web dashboard. In-game /vban alerts are instant regardless.
  poll-interval-seconds: 5
  # Placeholders: {reason} {ban_id} {type} {player} {staff} {duration}
  message: "&e{staff} &7{type_verb} &e{player}&7: &f{reason}"

# Shown to the player on the disconnect screen (bans, kicks) or in chat (mutes).
# Placeholders: {reason} {ban_id} {site_url} {duration} {expires_at}
# Colors and formatting use '&' codes: &c red, &7 gray, &f white, &b aqua, &l bold.
# This file is only written the first time the plugin runs. When you update the
# plugin, copy any changed messages across from the repo's config.yml yourself.
messages:
  ban: |-
    &c&lYOU ARE BANNED

    &7Reason: &f{reason}
    &7Ban ID: &f{ban_id}

    &7Appeal or view details:
    &b{site_url}/{ban_id}
  temp-ban: |-
    &c&lYOU ARE TEMPORARILY BANNED

    &7Reason: &f{reason}
    &7Expires: &f{expires_at}
    &7Ban ID: &f{ban_id}

    &7Appeal or view details:
    &b{site_url}/{ban_id}
  kick: |-
    &c&lYOU WERE KICKED

    &7Reason: &f{reason}
    &7Ban ID: &f{ban_id}

    &7Details:
    &b{site_url}/{ban_id}
  ip-ban: |-
    &c&lTHIS NETWORK IS BANNED

    &7Reason: &f{reason}
    &7Ban ID: &f{ban_id}

    &7Appeal or view details:
    &b{site_url}/{ban_id}
  mute: |-
    &c&lYOU ARE MUTED
    &7Reason: &f{reason}
    &7Ban ID: &f{ban_id}
    &7Appeal or view details: &b{site_url}/{ban_id}
  temp-mute: |-
    &c&lYOU ARE TEMPORARILY MUTED
    &7Reason: &f{reason}
    &7Expires: &f{expires_at}
    &7Ban ID: &f{ban_id}
    &7Appeal or view details: &b{site_url}/{ban_id}
